<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="tic.css">
    <title>rock paper sissor </title>
</head>
<body>
    <h1>welcome to game</h1>
    <section class="image">
         
         
        <div  class="photo" id="rock">
            <img   src="/images/rock.png">
        </div>
        <div  class="photo" id="sissor">
            <img  src="/images/sisor.jpg">
        </div>
        <div  class="photo" id="paper">
            <img   src="/images/paper.png">
        </div>
        
    </section>
    <section class="score-board">
         
            <div class="user-score">
                <p id="uc">0</p>
                <p>Your score </p>
            </div>
            <div class="user-score">
                <p id="cc">0</p>
                <p>computer score </p>
            </div>
         
    </section>
    <div class="event-msg"> <p id="msg">paly the game</p> </div>
    <script src="script.js" defer></script>
</body>
</html>
